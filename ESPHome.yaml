esphome:
  name: pool-light
  friendly_name: Pool light
  comment: Replaces pool lights RF433 remote

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: ""

ota:
  platform: esphome
  password: ""

wifi:
  ssid: 
  password: 

  ap:
    ssid: "Pool light Fallback Hotspot"
    password: ""

captive_portal:

remote_transmitter:
  pin: GPIO5
  carrier_duty_percent: 100%

button:
  - platform: template
    name: "Pair"
    icon: "mdi:signal-variant"
    entity_category: config
    on_press:
      - remote_transmitter.transmit_raw:
          code: [277, -7520]
      - remote_transmitter.transmit_rc_switch_raw:
          code: '111110100100110001100011'
          protocol:
            sync: [3, 1]
            pulse_length: 260
          repeat:
            times: 10
            wait_time: 7510us

switch:
  - platform: template
    name: "On/Off"
    optimistic: true
    turn_on_action:
      - remote_transmitter.transmit_raw:
          code: [23110, -7507]
      - remote_transmitter.transmit_rc_switch_raw:
          code: '111110100100110000001111'
          protocol:
            sync: [3, 1]
            pulse_length: 260
          repeat:
            times: 10
            wait_time: 7510us
    turn_off_action:
      - remote_transmitter.transmit_raw:
          code: [11596, -30424]
      - remote_transmitter.transmit_rc_switch_raw:
          code: '111110100100110001110001'
          protocol:
            sync: [3, 1]
            pulse_length: 260
          repeat:
            times: 10
            wait_time: 7510us

select:
  - platform: template
    name: "Light intensity or Effect Speed"
    icon: "mdi:remote"
    initial_option: "Choose" 
    options:
      - "Choose"
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
      - "6"
      - "7"
      - "8"
    set_action:
